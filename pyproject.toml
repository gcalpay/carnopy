[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "carnopy"
dynamic = ["version"]
description = "Reproducible thermophysical datasets from scientific backends with visualization, provenance, and leakage-aware preparation for physics-informed machine-learning and engineering workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gcalpay" }]
keywords = [
  "thermodynamics",
  "thermophysical",
  "thermophysical properties",
  "fluid properties",
  "dataset generation",
  "synthetic data",
  "data provenance",
  "data visualization",
  "data leakage prevention",
  "leakage-aware",
  "machine learning",
  "surrogate modeling",
  "CoolProp",
  "chemical-engineering",
]
dependencies = [
  "CoolProp>=8,<9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.8",
  "typer>=0.12",
  "PyYAML>=6.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/gcalpay/carnopy"
Documentation = "https://github.com/gcalpay/carnopy#readme"
Issues = "https://github.com/gcalpay/carnopy/issues"
Releases = "https://github.com/gcalpay/carnopy/releases"

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8",
  "Pillow>=12.3.0",
]
ml = [
  "safetensors>=0.4.5",
]
analysis = [
  "scikit-learn>=1.9,<2",
]
app = [
  "PySide6-Essentials>=6.11.1,<6.12",
  "matplotlib>=3.8",
  "Pillow>=12.3.0",
]
all = [
  "matplotlib>=3.8",
  "Pillow>=12.3.0",
  "PySide6-Essentials>=6.11.1,<6.12",
  "safetensors>=0.4.5",
  "scikit-learn>=1.9,<2",
]

[dependency-groups]
test = [
  "pytest>=8",
]
lint = [
  "ruff>=0.9",
]
type = [
  "mypy>=1.13",
  "pandas-stubs>=2.2",
]
release = [
  "build>=1.2",
  "twine>=6",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "type" },
]

[project.scripts]
carnopy = "carnopy.__main__:main"
carnopy-app = "carnopy.app.qml_launcher:main_app"
carnopy-gui = "carnopy.app.qml_launcher:main_gui"

[tool.hatch.version]
path = "src/carnopy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/carnopy"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/CITATION.cff",
  "/DESKTOP_ARCHITECTURE.md",
  "/docs/agent-guides",
  "/LICENSE",
  "/ML_PREPARATION_ROADMAP.md",
  "/README.md",
  "/configs",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
  "/uv.lock",
]
exclude = [
  "/build",
  "/dist",
  "/figures",
  "/outputs",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/carnopy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "CoolProp",
  "CoolProp.*",
  "yaml",
  "pyarrow",
  "pyarrow.*",
  "matplotlib",
  "matplotlib.*",
  "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
