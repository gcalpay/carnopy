name: Publish verified distributions

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Verify tag and source version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_VERSION="$(python -c \
            'import re; from pathlib import Path; text=Path("src/carnopy/_version.py").read_text(); print(re.search(r"""__version__\s*=\s*"([^"]+)""", text).group(1))')"
          test "$GITHUB_REF_NAME" != "$VERSION"
          test "$VERSION" = "$SOURCE_VERSION"
      - name: Verify lock file
        run: uv lock --check
      - name: Synchronize development dependencies
        run: >-
          uv sync --locked --python 3.12
          --extra viz --extra ml --group dev
      - name: Run Ruff
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Run strict core mypy
        run: uv run --locked mypy src/carnopy --exclude '^src/carnopy/app/'
      - name: Smoke-test lightweight help
        run: uv run --locked python -m carnopy --help
      - name: Check environment dependencies
        run: uv pip check --python .venv/bin/python

  tests:
    name: Release tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Synchronize test dependencies
        run: >-
          uv sync --locked --python "${{ matrix.python-version }}"
          --extra viz --extra ml --extra analysis --no-default-groups --group test
      - name: Run tests
        run: >-
          uv run --locked --extra viz --extra ml --extra analysis
          --no-default-groups --group test pytest
          --ignore-glob=tests/test_app_*.py
      - name: Check environment dependencies
        run: uv pip check --python .venv/bin/python

  app:
    name: Release desktop app (Python 3.12)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Synchronize desktop test dependencies
        run: >-
          uv sync --locked --python 3.12
          --extra app --no-default-groups --group test --group type
      - name: Verify Qt runtime baseline
        run: >-
          uv run --locked --extra app --no-default-groups
          python -c "from PySide6.QtCore import qVersion;
          version = tuple(map(int, qVersion().split('.')));
          assert (6, 11, 1) <= version < (6, 12), qVersion()"
      - name: Check QML sources
        run: >-
          uv run --locked --extra app --no-default-groups
          python scripts/check_qml.py
      - name: Run strict desktop mypy
        run: >-
          uv run --locked --extra app --no-default-groups --group type
          mypy src/carnopy/app
      - name: Run desktop tests
        run: >-
          uv run --locked --extra app --no-default-groups --group test pytest
          tests/test_app_*.py
      - name: Check environment dependencies
        run: uv pip check --python .venv/bin/python

  qml-smoke:
    name: Release installed QML smoke (${{ matrix.runner }})
    needs:
      - build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Install Linux Qt runtime dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Download candidate distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: qml-smoke-dist
      - name: Run installed QML startup and interaction smoke
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/carnopy-qml-smoke"
          SMOKE_PYTHON="$RUNNER_TEMP/carnopy-qml-smoke/bin/python"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SMOKE_PYTHON="$RUNNER_TEMP/carnopy-qml-smoke/Scripts/python.exe"
          fi
          SMOKE_BIN="$(dirname "$SMOKE_PYTHON")"
          GUI_LAUNCHER="$SMOKE_BIN/carnopy-gui"
          APP_LAUNCHER="$SMOKE_BIN/carnopy-app"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            GUI_LAUNCHER="$GUI_LAUNCHER.exe"
            APP_LAUNCHER="$APP_LAUNCHER.exe"
          fi
          WHEEL_URI="$("$SMOKE_PYTHON" -c \
            'from pathlib import Path; import sys; wheels = list(Path(sys.argv[1]).glob("*.whl")); assert len(wheels) == 1, wheels; print(wheels[0].resolve().as_uri())' \
            "$PWD/qml-smoke-dist")"
          "$SMOKE_PYTHON" -m pip install \
            --index-url https://pypi.org/simple/ \
            "carnopy[app] @ ${WHEEL_URI}"
          "$SMOKE_PYTHON" -m pip check
          QT_QPA_PLATFORM=offscreen \
          "$GUI_LAUNCHER" --smoke-test
          QT_QPA_PLATFORM=offscreen \
          "$APP_LAUNCHER" --smoke-test

  build:
    name: Build distributions once
    needs:
      - quality
      - tests
      - app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Synchronize release dependencies
        run: uv sync --locked --python 3.12 --no-default-groups --group release
      - name: Build wheel and sdist
        run: >-
          uv run --locked --no-default-groups --group release
          python -m build
      - name: Upload candidate distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-distributions
          path: dist/
          if-no-files-found: error

  inspect:
    name: Inspect and smoke-test distributions
    needs:
      - build
      - qml-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Synchronize release dependencies
        run: >-
          uv sync --locked --python 3.12
          --no-default-groups --group release
      - name: Download candidate distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: release/dist
      - name: Verify version, metadata, and package contents
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run --locked --no-default-groups --group release \
            python -m twine check release/dist/*
          uv run --locked --no-default-groups \
            python scripts/check_distribution.py \
            --expected-version "$VERSION" \
            release/dist/*
      - name: Smoke-test base wheel outside checkout
        shell: bash
        run: |
          WHEEL="$(find "$PWD/release/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-base"
          "$RUNNER_TEMP/carnopy-base/bin/python" -m pip install "$WHEEL"
          "$RUNNER_TEMP/carnopy-base/bin/python" -m pip check
          "$RUNNER_TEMP/carnopy-base/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/base-smoke" \
            --expected-version "${GITHUB_REF_NAME#v}"
      - name: Smoke-test wheel with ML extra outside checkout
        shell: bash
        run: |
          WHEEL="$(find "$PWD/release/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-ml"
          WHEEL_URI="$("$RUNNER_TEMP/carnopy-ml/bin/python" -c \
            'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' \
            "$WHEEL")"
          "$RUNNER_TEMP/carnopy-ml/bin/python" -m pip install \
            --index-url https://pypi.org/simple/ \
            "carnopy[ml] @ ${WHEEL_URI}"
          "$RUNNER_TEMP/carnopy-ml/bin/python" -m pip check
          "$RUNNER_TEMP/carnopy-ml/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/ml-smoke" \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --with-ml-exports
      - name: Smoke-test sdist and reconstruct wheel outside checkout
        shell: bash
        run: |
          SDIST="$(find "$PWD/release/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-sdist"
          "$RUNNER_TEMP/carnopy-sdist/bin/python" -m pip install "$SDIST"
          "$RUNNER_TEMP/carnopy-sdist/bin/python" -m pip check
          "$RUNNER_TEMP/carnopy-sdist/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/sdist-smoke" \
            --expected-version "${GITHUB_REF_NAME#v}"
          "$RUNNER_TEMP/carnopy-sdist/bin/python" -m pip wheel \
            --no-deps \
            --wheel-dir "$RUNNER_TEMP/rebuilt-wheel" \
            "$SDIST"
      - name: Smoke-test wheel with analysis extra outside checkout
        shell: bash
        run: |
          WHEEL="$(find "$PWD/release/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-analysis"
          WHEEL_URI="$("$RUNNER_TEMP/carnopy-analysis/bin/python" -c \
            'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' \
            "$WHEEL")"
          "$RUNNER_TEMP/carnopy-analysis/bin/python" -m pip install \
            --index-url https://pypi.org/simple/ \
            "carnopy[analysis] @ ${WHEEL_URI}"
          "$RUNNER_TEMP/carnopy-analysis/bin/python" -m pip check
          "$RUNNER_TEMP/carnopy-analysis/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/analysis-smoke" \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --with-analysis
      - name: Install Qt runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Smoke-test wheel with app extra outside checkout
        shell: bash
        run: |
          WHEEL="$(find "$PWD/release/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-app"
          WHEEL_URI="$("$RUNNER_TEMP/carnopy-app/bin/python" -c \
            'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' \
            "$WHEEL")"
          "$RUNNER_TEMP/carnopy-app/bin/python" -m pip install \
            --index-url https://pypi.org/simple/ \
            "carnopy[app] @ ${WHEEL_URI}"
          "$RUNNER_TEMP/carnopy-app/bin/python" -m pip check
          QT_QPA_PLATFORM=offscreen \
          "$RUNNER_TEMP/carnopy-app/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/app-smoke" \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --with-visualization \
            --with-app
      - name: Smoke-test wheel with all extras outside checkout
        shell: bash
        run: |
          WHEEL="$(find "$PWD/release/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-all"
          WHEEL_URI="$("$RUNNER_TEMP/carnopy-all/bin/python" -c \
            'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' \
            "$WHEEL")"
          "$RUNNER_TEMP/carnopy-all/bin/python" -m pip install \
            --index-url https://pypi.org/simple/ \
            "carnopy[all] @ ${WHEEL_URI}"
          "$RUNNER_TEMP/carnopy-all/bin/python" -m pip check
          "$RUNNER_TEMP/carnopy-all/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/all-smoke" \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --with-visualization \
            --with-ml-exports \
            --with-analysis \
            --with-app
      - name: Write release checksums
        run: >-
          uv run --locked --no-default-groups
          python scripts/hash_distributions.py
          release/dist/*
          --output release/SHA256SUMS
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-distributions
          path: release/
          if-no-files-found: error

  publish-pypi:
    name: Approve and publish to PyPI
    needs:
      - inspect
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/carnopy
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-distributions
          path: release
      - name: Publish byte-identical distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/dist/

  smoke-pypi:
    name: Verify production PyPI release
    needs:
      - publish-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Download verified checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-distributions
          path: release
      - name: Download and verify PyPI files through its JSON API
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/verify_index_release.py \
            --index-base https://pypi.org/pypi \
            --project carnopy \
            --version "$VERSION" \
            --checksums release/SHA256SUMS \
            --output-directory "$RUNNER_TEMP/pypi-files"
      - name: Install and smoke-test verified PyPI wheel
        shell: bash
        run: |
          WHEEL="$(find "$RUNNER_TEMP/pypi-files" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/pypi-smoke-env"
          WHEEL_URI="$("$RUNNER_TEMP/pypi-smoke-env/bin/python" -c \
            'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' \
            "$WHEEL")"
          "$RUNNER_TEMP/pypi-smoke-env/bin/python" -m pip install \
            --index-url https://pypi.org/simple/ \
            "carnopy[all] @ ${WHEEL_URI}"
          "$RUNNER_TEMP/pypi-smoke-env/bin/python" -m pip check
          "$RUNNER_TEMP/pypi-smoke-env/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/pypi-smoke" \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --with-visualization \
            --with-ml-exports \
            --with-analysis \
            --with-app
