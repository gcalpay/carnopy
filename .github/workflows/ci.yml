name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  quality:
    name: Quality (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Verify lock file
        run: uv lock --check
      - name: Synchronize development dependencies
        run: >-
          uv sync --locked --python 3.12
          --extra viz --extra ml --group dev
      - name: Run Ruff
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Run strict core mypy
        run: uv run --locked mypy src/carnopy --exclude '^src/carnopy/app/'
      - name: Check environment dependencies
        run: uv pip check --python .venv/bin/python

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Synchronize test dependencies
        run: >-
          uv sync --locked --python "${{ matrix.python-version }}"
          --extra viz --extra ml --extra analysis --no-default-groups --group test
      - name: Run tests
        run: >-
          uv run --locked --extra viz --extra ml --extra analysis
          --no-default-groups --group test pytest
          --ignore-glob=tests/test_app_*.py
      - name: Check environment dependencies
        run: uv pip check --python .venv/bin/python

  app:
    name: Desktop app (Python 3.12)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Qt runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Synchronize desktop test dependencies
        run: >-
          uv sync --locked --python 3.12
          --extra app --no-default-groups --group test --group type
      - name: Run strict desktop mypy
        run: >-
          uv run --locked --extra app --no-default-groups --group type
          mypy src/carnopy/app
      - name: Run desktop tests
        run: >-
          uv run --locked --extra app --no-default-groups --group test pytest
          tests/test_app_*.py
      - name: Check environment dependencies
        run: uv pip check --python .venv/bin/python

  qml-native-qualification:
    name: QML/VTK native qualification
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'branch' &&
      github.ref == 'refs/heads/feat/gui2-qml-3d'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARNOPY_QT_RUNTIME_PACKAGES: >-
        binutils
        ca-certificates
        libdbus-1-3
        libegl1
        libfontconfig1
        libgl1
        libgl1-mesa-dri
        libglib2.0-0t64
        libglx-mesa0
        libgssapi-krb5-2
        libopengl0
        libx11-xcb1
        libxcb-cursor0
        libxcb-glx0
        libxcb-icccm4
        libxcb-image0
        libxcb-keysyms1
        libxcb-randr0
        libxcb-render0
        libxcb-render-util0
        libxcb-shape0
        libxcb-shm0
        libxcb-sync1
        libxcb-util1
        libxcb-xfixes0
        libxcb-xinerama0
        libxcb-xkb1
        libxkbcommon0
        libxkbcommon-x11-0
        mesa-utils
        python3.12
        python3.12-venv
        xauth
        xvfb
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Probe clean Qt Quick runtime
        shell: bash
        run: |
          PROBE="$RUNNER_TEMP/qml-runtime-probe"
          mkdir "$PROBE"
          cp native/carnopy-vtk-bridge/tests/qualification.py "$PROBE/"
          timeout --foreground --signal=TERM --kill-after=15s 600s \
            docker run --rm \
              --env CARNOPY_QT_RUNTIME_PACKAGES \
              --mount "type=bind,src=${PROBE},dst=/qualification,readonly" \
              --workdir /tmp \
              ubuntu:24.04 \
              bash -euxo pipefail -c '
                export DEBIAN_FRONTEND=noninteractive
                read -r -a runtime_packages <<< "$CARNOPY_QT_RUNTIME_PACKAGES"
                apt-get update
                apt-get install --yes --no-install-recommends "${runtime_packages[@]}"
                python3.12 -m venv /opt/qt-runtime
                /opt/qt-runtime/bin/python -I -m pip install \
                  --no-cache-dir \
                  --index-url https://pypi.org/simple/ \
                  PySide6-Essentials==6.11.1
                unset \
                  CMAKE_ARGS \
                  CMAKE_BUILD_PARALLEL_LEVEL \
                  CMAKE_GENERATOR \
                  CMAKE_PREFIX_PATH \
                  LD_LIBRARY_PATH \
                  PYTHONHOME \
                  PYTHONPATH \
                  QML2_IMPORT_PATH \
                  QML_IMPORT_PATH \
                  QTDIR \
                  QT_PLUGIN_PATH \
                  Qt6_DIR
                xvfb-run --auto-servernum \
                  --server-args="-screen 0 640x480x24 +extension GLX +render -noreset" \
                  env \
                    LIBGL_ALWAYS_SOFTWARE=1 \
                    QSG_RHI_BACKEND=opengl \
                    QT_OPENGL=software \
                    QT_QPA_PLATFORM=xcb \
                    QT_SCALE_FACTOR=1 \
                    /opt/qt-runtime/bin/python -I \
                    /qualification/qualification.py smoke-qt-runtime
              '
      - name: Install native build library
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgl1-mesa-dev
      - name: Install exact Qt SDK
        run: >-
          uvx --from aqtinstall==3.3.0 aqt install-qt
          linux desktop 6.11.1 linux_gcc_64
          --outputdir "$RUNNER_TEMP/Qt"
      - name: Build Carnopy and native bridge wheels
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/Qt/6.11.1/gcc_64
          Qt6_DIR: ${{ runner.temp }}/Qt/6.11.1/gcc_64/lib/cmake/Qt6
        run: |
          mkdir -p "$RUNNER_TEMP/root-wheel" "$RUNNER_TEMP/bridge-wheel"
          uv build --wheel --out-dir "$RUNNER_TEMP/root-wheel" .
          uv build --wheel --out-dir "$RUNNER_TEMP/bridge-wheel" \
            native/carnopy-vtk-bridge
      - name: Check and inspect wheels
        shell: bash
        run: |
          ROOT_WHEEL="$(find "$RUNNER_TEMP/root-wheel" -maxdepth 1 -name '*.whl' -print -quit)"
          BRIDGE_WHEEL="$(find "$RUNNER_TEMP/bridge-wheel" -maxdepth 1 -name '*.whl' -print -quit)"
          uvx --from twine==6.2.0 twine check "$ROOT_WHEEL" "$BRIDGE_WHEEL"
          python -I native/carnopy-vtk-bridge/tests/qualification.py \
            inspect-wheel "$BRIDGE_WHEEL"
      - name: Stage isolated qualification payload
        shell: bash
        run: |
          ROOT_WHEEL="$(find "$RUNNER_TEMP/root-wheel" -maxdepth 1 -name '*.whl' -print -quit)"
          BRIDGE_WHEEL="$(find "$RUNNER_TEMP/bridge-wheel" -maxdepth 1 -name '*.whl' -print -quit)"
          PAYLOAD="$RUNNER_TEMP/qml-native-payload"
          mkdir "$PAYLOAD"
          cp "$ROOT_WHEEL" "$PAYLOAD/"
          cp "$BRIDGE_WHEEL" "$PAYLOAD/"
          cp native/carnopy-vtk-bridge/tests/qualification.py "$PAYLOAD/"
          test "$(find "$PAYLOAD" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
      - name: Run qualification in fresh runtime container
        shell: bash
        run: |
          PAYLOAD="$RUNNER_TEMP/qml-native-payload"
          timeout --foreground --signal=TERM --kill-after=15s 600s \
            docker run --rm \
              --env CARNOPY_QT_RUNTIME_PACKAGES \
              --mount "type=bind,src=${PAYLOAD},dst=/qualification,readonly" \
              --workdir /tmp \
              ubuntu:24.04 \
              bash -euxo pipefail -c '
                export DEBIAN_FRONTEND=noninteractive
                read -r -a runtime_packages <<< "$CARNOPY_QT_RUNTIME_PACKAGES"
                apt-get update
                apt-get install --yes --no-install-recommends "${runtime_packages[@]}"
                python3.12 -m venv /opt/carnopy-runtime
                unset \
                  CMAKE_ARGS \
                  CMAKE_BUILD_PARALLEL_LEVEL \
                  CMAKE_GENERATOR \
                  CMAKE_PREFIX_PATH \
                  LD_LIBRARY_PATH \
                  PYTHONHOME \
                  PYTHONPATH \
                  QML2_IMPORT_PATH \
                  QML_IMPORT_PATH \
                  QTDIR \
                  QT_PLUGIN_PATH \
                  Qt6_DIR
                ROOT_WHEEL="$(find /qualification -maxdepth 1 -name carnopy-\*.whl -print -quit)"
                BRIDGE_WHEEL="$(find /qualification -maxdepth 1 -name carnopy_vtk_bridge-\*.whl -print -quit)"
                test -n "$ROOT_WHEEL"
                test -n "$BRIDGE_WHEEL"
                VENV=/opt/carnopy-runtime
                "$VENV/bin/python" -I -m pip install \
                  --no-cache-dir \
                  --index-url https://pypi.org/simple/ \
                  "carnopy[app] @ file://${ROOT_WHEEL}" \
                  "$BRIDGE_WHEEL"
                "$VENV/bin/python" -I -m pip check
                xvfb-run --auto-servernum \
                  --server-args="-screen 0 1280x1024x24 +extension GLX +render -noreset" \
                  env LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B \
                  | tee /tmp/glxinfo.txt
                grep --extended-regexp --ignore-case \
                  "llvmpipe|softpipe|software rasterizer" /tmp/glxinfo.txt
                xvfb-run --auto-servernum \
                  --server-args="-screen 0 1280x1024x24 +extension GLX +render -noreset" \
                  env \
                    LIBGL_ALWAYS_SOFTWARE=1 \
                    QSG_RHI_BACKEND=opengl \
                    QT_OPENGL=software \
                    QT_QPA_PLATFORM=xcb \
                    QT_SCALE_FACTOR=1 \
                    "$VENV/bin/python" -I \
                    /qualification/qualification.py smoke-installed
              '

  distribution:
    name: Distribution verification
    needs:
      - quality
      - tests
      - app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Synchronize release dependencies
        run: >-
          uv sync --locked --python 3.12
          --no-default-groups --group release
      - name: Build wheel and sdist once
        run: >-
          uv run --locked --no-default-groups --group release
          python -m build
      - name: Check metadata and README rendering
        run: >-
          uv run --locked --no-default-groups --group release
          python -m twine check dist/*
      - name: Inspect distribution contents
        run: >-
          uv run --locked --no-default-groups
          python scripts/check_distribution.py dist/*
      - name: Smoke-test base wheel outside checkout
        shell: bash
        run: |
          WHEEL="$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-base"
          "$RUNNER_TEMP/carnopy-base/bin/python" -m pip install "$WHEEL"
          "$RUNNER_TEMP/carnopy-base/bin/python" -m pip check
          "$RUNNER_TEMP/carnopy-base/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/base-smoke"
      - name: Smoke-test wheel with ML extra outside checkout
        shell: bash
        run: |
          WHEEL="$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-ml"
          WHEEL_URI="$("$RUNNER_TEMP/carnopy-ml/bin/python" -c \
            'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' \
            "$WHEEL")"
          "$RUNNER_TEMP/carnopy-ml/bin/python" -m pip install \
            --index-url https://pypi.org/simple/ \
            "carnopy[ml] @ ${WHEEL_URI}"
          "$RUNNER_TEMP/carnopy-ml/bin/python" -m pip check
          "$RUNNER_TEMP/carnopy-ml/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/ml-smoke" \
            --with-ml-exports
      - name: Smoke-test sdist and reconstruct wheel outside checkout
        shell: bash
        run: |
          SDIST="$(find "$PWD/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-sdist"
          "$RUNNER_TEMP/carnopy-sdist/bin/python" -m pip install "$SDIST"
          "$RUNNER_TEMP/carnopy-sdist/bin/python" -m pip check
          "$RUNNER_TEMP/carnopy-sdist/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/carnopy-sdist/bin/python" -m pip wheel \
            --no-deps \
            --wheel-dir "$RUNNER_TEMP/rebuilt-wheel" \
            "$SDIST"
      - name: Smoke-test wheel with analysis extra outside checkout
        shell: bash
        run: |
          WHEEL="$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-analysis"
          WHEEL_URI="$("$RUNNER_TEMP/carnopy-analysis/bin/python" -c \
            'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' \
            "$WHEEL")"
          "$RUNNER_TEMP/carnopy-analysis/bin/python" -m pip install \
            --index-url https://pypi.org/simple/ \
            "carnopy[analysis] @ ${WHEEL_URI}"
          "$RUNNER_TEMP/carnopy-analysis/bin/python" -m pip check
          "$RUNNER_TEMP/carnopy-analysis/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/analysis-smoke" \
            --with-analysis
      - name: Install Qt runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Smoke-test wheel with app extra outside checkout
        shell: bash
        run: |
          WHEEL="$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-app"
          WHEEL_URI="$("$RUNNER_TEMP/carnopy-app/bin/python" -c \
            'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' \
            "$WHEEL")"
          "$RUNNER_TEMP/carnopy-app/bin/python" -m pip install \
            --index-url https://pypi.org/simple/ \
            "carnopy[app] @ ${WHEEL_URI}"
          "$RUNNER_TEMP/carnopy-app/bin/python" -m pip check
          QT_QPA_PLATFORM=offscreen \
          "$RUNNER_TEMP/carnopy-app/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/app-smoke" \
            --with-visualization \
            --with-app
      - name: Smoke-test wheel with all extras outside checkout
        shell: bash
        run: |
          WHEEL="$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/carnopy-all"
          WHEEL_URI="$("$RUNNER_TEMP/carnopy-all/bin/python" -c \
            'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' \
            "$WHEEL")"
          "$RUNNER_TEMP/carnopy-all/bin/python" -m pip install \
            --index-url https://pypi.org/simple/ \
            "carnopy[all] @ ${WHEEL_URI}"
          "$RUNNER_TEMP/carnopy-all/bin/python" -m pip check
          "$RUNNER_TEMP/carnopy-all/bin/python" scripts/smoke_installed.py \
            --work-directory "$RUNNER_TEMP/all-smoke" \
            --with-visualization \
            --with-ml-exports \
            --with-analysis \
            --with-app
