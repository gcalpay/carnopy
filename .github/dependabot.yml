version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    exclude-paths:
      - "native/carnopy-vtk-bridge/**"
    schedule:
      interval: weekly
      day: monday
      time: "04:29"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:29"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
