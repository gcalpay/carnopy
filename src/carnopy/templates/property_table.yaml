# Pure-fluid states on a temperature-pressure Cartesian grid.
# Discover names with: carnopy fluids
# Discover output properties with: carnopy properties
schema_version: 2
document_type: dataset
backend:
  name: coolprop
  model: heos
mode: property_table
fluids:
  - Propane
  - Isobutane
grid:
  # linspace includes both endpoints.
  temperature:
    kind: linspace
    start: -50.0
    stop: 50.0
    num: 101
    unit: degC
  # linspace includes both endpoints in 0.1-atmosphere increments.
  pressure:
    kind: linspace
    start: 101325.0
    stop: 506625.0
    num: 41
    unit: Pa
properties:
  - specific_enthalpy
  - specific_entropy
  - mass_density
  - isobaric_specific_heat_capacity
  - dynamic_viscosity
  - thermal_conductivity
outputs:
  # Select one or both. Omission defaults to [csv, parquet].
  dataset_formats: [csv, parquet]
