# Carnopy preparation starter configuration.
#
# Preparation converts an existing immutable dataset run or model-sweep bundle
# into deterministic Parquet outputs for downstream ML/surrogate workflows.
# Optional array/tensor exports are derived from the Parquet table. Preparation
# never calls thermodynamic backends.
#
# Reference-dependent fields such as specific_enthalpy, specific_entropy, and
# specific_internal_energy are allowed only when selected rows share one
# compatible reference_state_policy/backend/model context. Carnopy records that
# context in the preparation manifest.

schema_version: 1
document_type: preparation

source_policy:
  allow_partial_sweep: false

features:
  numeric:
    - temperature
    - pressure
    - mass_density
  derived:
    - specific_volume

categorical_features:
  - field: phase
    encoding: one_hot
    categories: observed

targets:
  - specific_enthalpy

auxiliary:
  - fluid
  - backend_model
  - phase
  - run_id
  - case_id

# Optional leakage-aware scenarios. Omit this section to keep the default
# unsplit Stage-5 behavior.
#
# scenarios:
#   - name: shuffle_baseline
#     kind: shuffle
#     seed: 42
#     partitions:
#       train: 0.8
#       validation: 0.1
#       test: 0.1
#     transformations:
#       - field: pressure
#         methods: [log10, standard]  # also: minmax, robust
#
#   - name: leave_fluid_out
#     kind: leave_fluid_out
#     holdouts:
#       test: [Isopentane]
#     remainder: train
#
#   - name: phase_temperature_strata
#     kind: stratified_hash
#     seed: 42
#     partitions:
#       train: 0.8
#       validation: 0.1
#       test: 0.1
#     strata:
#       categorical: [phase]
#       numeric_bins:
#         reduced_temperature: [0.8, 0.95, 1.05]

# Optional matrix diagnostics use configured features only. Scenario diagnostics
# fit on train; an unsplit preparation states explicitly that it uses all rows.
# quality:
#   matrix_diagnostics:
#     correlation_threshold: 0.995
#     near_constant_relative_spread: 1.0e-12
#   # Requires carnopy[analysis]. Fits on train and evaluates validation/test;
#   # estimators and predictions are not persisted.
#   baseline_diagnostics:
#     models: [dummy_mean, ridge, hist_gradient_boosting]
#     random_seed: 42
#     ridge_alpha: 1.0
#     histogram_max_iterations: 100

outputs:
  formats: [parquet]
  # Equivalent structured form:
  # parquet: true
  # arrays:
  #   formats: [npy, npz, safetensors]
  #   dtype: float32
  #   include_auxiliary: false
